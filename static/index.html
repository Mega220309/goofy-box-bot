<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOOFY CULTURE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:monospace}
.wrap{max-width:480px;margin:0 auto;padding-bottom:80px}
.banner{width:100%;display:block;border-bottom:3px solid #111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{border:2px solid #111;border-radius:14px;padding:8px}
.pic{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.name{font-size:12px;font-weight:900;margin:6px 0}
.row{display:flex;gap:6px}
.price{background:#111;color:#fff;padding:6px 10px;border-radius:8px;font-weight:900}
.btn{flex:1;border:2px solid #111;background:#fff;border-radius:8px;padding:6px;font-weight:900;font-size:11px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:3px solid #111;display:flex;justify-content:space-around;padding:12px 0;text-align:center;font-size:12px;font-weight:900}
#cart{position:fixed;inset:0;background:#fff;z-index:99;display:none;padding:14px;max-width:480px;margin:0 auto}
</style>
</head>
<body>
<div class="wrap">
<img src="/static/banner.jpg.WEBP" class="banner" onerror="this.src='./banner.jpg.WEBP'">
<div style="text-align:center;padding:10px;font-weight:900">
КАТАЛОГ • <span id="cc">0</span> ТОВАРА
</div>
<div class="grid" id="grid"></div>
</div>

<div class="nav">
<div onclick="window.scrollTo(0,0)">⊞<br>Каталог</div>
<div onclick="openCart()">🛒<br>Корзина (<span id="cnt">0</span>)</div>
<div onclick="window.Telegram.WebApp.close()">👤<br>Профиль</div>
</div>

<div id="cart">
<b>КОРЗИНА</b>
<span onclick="document.getElementById('cart').style.display='none'" style="float:right;font-size:22px;cursor:pointer">✕</span>
<div id="clist" style="margin:12px 0"></div>
<b>ИТОГО <span id="csum">0</span>₽</b>
<div style="background:#111;color:#fff;text-align:center;padding:14px;border-radius:10px;margin-top:12px" onclick="sendOrder()">ОФОРМИТЬ В TELEGRAM</div>
</div>

<script>
let prods=[],cart=JSON.parse(localStorage.getItem('gcfinal')||'[]');
let tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
async function load(){
 try{
  let r=await fetch('/api/products');
  prods=await r.json();
 }catch(e){prods=[]}
 document.getElementById('cc').innerText=prods.length;
 let g=document.getElementById('grid');
 if(!prods.length){
  g.innerHTML='<div style="grid-column:1/3;border:2px dashed #111;border-radius:14px;padding:30px;text-align:center">ПУСТО<br>Добавь через /add в боте</div>';
  return
 }
 g.innerHTML='';
 for(let p of prods){
  let d=document.createElement('div');
  d.className='card';
  d.innerHTML=`
   <div class=pic><img id="i${p.id}"></div>
   <div class=name>${p.name}</div>
   <div class=row>
    <div class=price>${p.price}₽</div>
    <div class=btn onclick="add(${p.id})">В КОРЗИНУ</div>
   </div>`;
  g.appendChild(d);
  if(p.img) fetch('/api/file/'+p.img).then(r=>r.json()).then(j=>{
   let im=document.getElementById('i'+p.id);
   if(im) im.src=j.url
  });
 }
 upd();
}
function add(id){
 let p=prods.find(x=>x.id==id);
 cart.push(p);
 localStorage.setItem('gcfinal',JSON.stringify(cart));
 upd();openCart();
}
function upd(){
 document.getElementById('cnt').innerText=cart.length;
 let s=cart.reduce((a,c)=>a+(+c.price||0),0);
 document.getElementById('csum').innerText=s;
 document.getElementById('clist').innerHTML=cart.map((c,i)=>`${c.name} ${c.price}₽ <span onclick="cart.splice(${i},1);localStorage.setItem('gcfinal',JSON.stringify(cart));upd()" style="color:red">[x]</span>`).join('<br>')||'Пусто';
}
function openCart(){document.getElementById('cart').style.display='block';upd();}
async function sendOrder(){
 let sum=cart.reduce((a,c)=>a+(+c.price||0),0);
 let text=`🔥 ЗАКАЗ GOOFY\n${cart.map(c=>`• ${c.name} ${c.price}₽`).join('\n')}\nИтого: ${sum}₽`;
 try{
  await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,items:cart})});
  alert('Улетело!');
  cart=[];localStorage.removeItem('gcfinal');upd();
  document.getElementById('cart').style.display='none';
 }catch(e){window.open('https://t.me/goofyproculture?text='+encodeURIComponent(text),'_blank');}
}
load();
</script>
</body>
</html>
