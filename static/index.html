<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOOFY BOX</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box;margin:0}body{background:#fff;color:#111;font-family:monospace;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto;padding-bottom:90px}
.banner-wrap{position:relative;border-bottom:3px solid #111;overflow:hidden;background:#000}
.banner{width:100%;display:block;filter:contrast(1.15)}
.banner-wrap:after{content:'';position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(90deg, transparent 0%, rgba(255,0,0,.2) 45%, rgba(0,255,255,.2) 55%, transparent 100%);animation:glitch 2s infinite;pointer-events:none}
@keyframes glitch{0%{transform:translateX(-100%)}20%{transform:translateX(100%)}100%{transform:translateX(100%)}}
.secret{position:absolute;top:4px;right:8px;z-index:9;padding:12px;font-size:16px;opacity:.5}
.head{padding:14px;text-align:center;font-weight:900;border-bottom:3px solid #111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{border:2.5px solid #111;border-radius:16px;padding:8px}
.pic{aspect-ratio:1;background:#eee;border-radius:12px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.brand{font-size:10px;opacity:.5;font-weight:900;margin-top:4px}
.name{font-size:12px;font-weight:900;height:26px;overflow:hidden}
.price{background:#111;color:#fff;padding:6px 9px;border-radius:8px;display:inline-block;font-weight:900;font-size:11px;margin-top:4px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:3px solid #111;display:flex;justify-content:space-around;padding:12px 0;text-align:center;z-index:20}
.icon{width:34px;height:34px;border:2.5px solid #111;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;background:#fff;position:relative}
.icon.box:before{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:14px;height:7px;border:2.5px solid #111;border-bottom:0;border-radius:4px 4px 0 0;background:#fff}
.icon.box.jump{animation:jump .5s}
@keyframes jump{50%{transform:translateY(-10px)}}
