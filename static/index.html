<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOOFY CULTURE BOX</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box;margin:0}body{background:#fff;color:#111;font-family:monospace}
.wrap{max-width:480px;margin:0 auto;padding-bottom:90px;min-height:100vh}
.banner{width:100%;display:block;border-bottom:3px solid #111}
.head{padding:12px;text-align:center;font-weight:900;border-bottom:3px solid #111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{border:2.5px solid #111;border-radius:16px;padding:8px;cursor:pointer;background:#fff;position:relative}
.pic{aspect-ratio:1;background:#f2f2f2;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pic img{width:100%;height:100%;object-fit:cover}
.brand{font-size:10px;opacity:.5;font-weight:900;margin-top:6px;text-transform:uppercase}
.name{font-size:12px;font-weight:900;height:26px;overflow:hidden;margin:2px 0}
.price{background:#111;color:#fff;padding:7px 10px;border-radius:9px;display:inline-block;font-weight:900;font-size:11px;margin-top:6px;letter-spacing:.3px}
.price.sold{background:#111;color:#fff;transform:rotate(-2deg);border:2px solid #fff;outline:2px solid #111;box-shadow:0 2px 0 #111}
.tag{position:absolute;top:8px;left:8px;background:#fff;border:2px solid #111;border-radius:6px;padding:2px 6px;font-size:9px;font-weight:900;z-index:2}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:3.5px solid #111;display:flex;justify-content:space-around;padding:14px 0;text-align:center;font-weight:900;font-size:11px;z-index:20}
#modal{position:fixed;inset:0;background:#fff;z-index:99;display:none;overflow:auto;max-width:480px;margin:0 auto;border-left:3px solid #111;border-right:3px solid #111}
.gal{display:flex;gap:10px;overflow-x:auto;padding:12px;scroll-snap-type:x mandatory}
.gal img{width:88%;aspect-ratio:1;object-fit:cover;border-radius:16px;border:2.5px solid #111;flex-shrink:0;scroll-snap-align:center}
.btn{width:100%;padding:16px;border-radius:12px;font-weight:900;border:2.5px solid #111;background:#111;color:#fff;font-size:14px}
.btn:disabled{background:#111;color:#fff;opacity:1}
</style></head><body><div class="wrap">
<img src="/static/banner.jpg.WEBP" class="banner" onerror="this.src='./banner.jpg.WEBP'">
<div class="head">КАТАЛОГ • <span id="cc">0</span> ТОВАРА</div>
<div class="grid" id="grid"></div>
</div><div class="nav"><div onclick="window.scrollTo(0,0)">⊞<br>Каталог</div><div>🛒<br>Корзина</div><div onclick="Telegram.WebApp.close()">✕<br>Закрыть</div></div><div id="modal"></div>
<script>
let P=[], tg=Telegram.WebApp; tg.ready(); tg.expand();
async function load(){
 try{let r=await fetch('/api/products'); P=await r.json();}catch(e){P=[]}
 document.getElementById('cc').innerText=P.length;
 let g=document.getElementById('grid');
 if(!P.length){g.innerHTML='<div style="grid-column:1/3;text-align:center;padding:40px;border:2.5px dashed #111;border-radius:16px;font-weight:900">ПУСТО</div>'; return}
 g.innerHTML=P.map(p=>`
  <div class="card" onclick="openM(${p.id})">
   ${p.tag?`<div class=tag>${p.tag}</div>`:''}
   <div class="pic"><img id="im_${p.id}" src=""></div>
   <div class="brand">${(p.brand||'GOOFY')}</div>
   <div class="name">${p.name}</div>
   ${p.status==='sold_recent'?`<div class="price sold">СП*ЗДИЛИ? САМ ВИНОВАТ</div>`:`<div class="price">${p.price}₽</div>`}
  </div>`).join('');
 P.forEach(async p=>{
  let fid=p.images&&p.images[0]?p.images[0]:p.img; if(!fid) return;
  try{let rr=await fetch('/api/file/'+fid); let jj=await rr.json(); document.getElementById('im_'+p.id).src=jj.url;}catch(e){}
 });
}
function openM(id){
 let p=P.find(x=>x.id==id); let imgs=(p.images&&p.images.length?p.images:[p.img]).filter(Boolean);
 let gal=imgs.map((_,i)=>`<img id="g_${id}_${i}" src="">`).join('');
 let btn=p.status==='sold_recent'?`<button disabled class=btn>СП*ЗДИЛИ? САМ ВИНОВАТ</button><div style="text-align:center;font-size:11px;margin-top:8px;opacity:.6">Уйдет из каталога через 10ч</div>`:`<button class=btn>В КОРЗИНУ — ${p.price}₽</button>`;
 document.getElementById('modal').innerHTML=`
  <div style="padding:12px;display:flex;justify-content:space-between;border-bottom:3px solid #111"><b>${p.brand}</b><span onclick="document.getElementById('modal').style.display='none'" style="font-size:26px">✕</span></div>
  <div class="gal">${gal||'<div style="padding:20px">НЕТ ФОТО</div>'}</div>
  <div style="padding:14px"><h2>${p.name}</h2><div style="opacity:.7;font-size:13px;margin:6px 0">${p.size||''} ${p.tag||''}</div><h2>${p.price}₽</h2><div style="margin-top:12px">${btn}</div></div>`;
 document.getElementById('modal').style.display='block';
 imgs.forEach(async(fid,i)=>{try{let rr=await fetch('/api/file/'+fid); let jj=await rr.json(); document.getElementById(`g_${id}_${i}`).src=jj.url;}catch(e){}});
}
load();
</script></body></html>
