<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOOFY BOX</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box;margin:0}body{background:#fff;color:#111;font-family:monospace;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto;padding-bottom:90px}
.banner{width:100%;display:block;border-bottom:3px solid #111;background:#f2f2f2}
.head{padding:14px;text-align:center;font-weight:900;border-bottom:3px solid #111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{border:2.5px solid #111;border-radius:16px;padding:8px;background:#fff}
.pic{aspect-ratio:1;background:#eee;border-radius:12px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.price{background:#111;color:#fff;padding:6px 9px;border-radius:8px;display:inline-block;font-weight:900;font-size:11px;margin-top:6px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:3.5px solid #111;display:flex;justify-content:space-around;padding:12px 0;text-align:center;z-index:20}
.icon{width:34px;height:34px;border:2.5px solid #111;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;background:#fff;position:relative}
.icon.box:before{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:14px;height:7px;border:2.5px solid #111;border-bottom:0;border-radius:4px 4px 0 0;background:#fff}
.icon.box.jump{animation:jump.5s}
@keyframes jump{50%{transform:translateY(-10px)}}
#modal,#cartModal{position:fixed;inset:0;background:#fff;z-index:99;display:none;overflow:auto;max-width:480px;margin:0 auto;border-left:3px solid #111;border-right:3px solid #111}
.gal{display:flex;gap:10px;overflow-x:auto;padding:12px}
.gal img{flex:0 0 85%;width:85%;aspect-ratio:1;object-fit:cover;border:3px solid #111;border-radius:16px}
.btn{width:100%;padding:16px;border-radius:12px;font-weight:900;border:3px solid #111;background:#111;color:#fff}
.btn.added{background:#fff;color:#111;border-style:dashed}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:10px;font-weight:900;opacity:0;transition:.3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
.shake{animation:shake.3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flex{margin:12px;border:2.5px solid #111;border-radius:12px;padding:10px}
.bar{height:14px;background:#eee;border:2px solid #111;border-radius:7px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:#111;width:0%;transition:.5s}
.conf{position:fixed;top:-10px;width:8px;height:12px;background:#111;animation:fall 1.2s linear forwards;pointer-events:none;z-index:200}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.banner-wrap{position:relative;border-bottom:3px solid #111}
.secret{position:absolute;top:0;right:0;padding:14px;opacity:.35;font-size:18px;z-index:5}
</style></head><body>
<div class="wrap">
<div class="banner-wrap">
<img src="/static/banner.jpg.WEBP" onerror="this.src='/static/banner.webp'" class="banner">
<div class="secret" onclick="steal()">✦</div>
</div>
<div class="head">КАТАЛОГ</div>
<div id="grid" class="grid">Загрузка...</div>
</div>
<div class="nav">
<div onclick="closeAll();window.scrollTo(0,0)" style="cursor:pointer"><div class="icon">⊞</div><div style="font-size:11px;font-weight:900;margin-top:4px">Каталог</div></div>
<div onclick="openCart()" style="cursor:pointer"><div class="icon box" id="boxIcon"></div><div id="cartCount" style="font-size:11px;font-weight:900;margin-top:4px">Коробка</div></div>
<div onclick="Telegram.WebApp.close()" style="cursor:pointer"><div class="icon">×</div><div style="font-size:11px;font-weight:900;margin-top:4px">Закрыть</div></div>
</div>
<div class="toast" id="toast"></div>
<div id="modal"></div>
<div id="cartModal"></div>
<script>
let P=[], CART_KEY='goofy_box_v3', CART=[], STEAL=0, DISCOUNT=0;
try{CART=JSON.parse(localStorage.getItem(CART_KEY)||'[]')}catch(e){CART=[]}
CART=CART.map(Number);
let tg=window.Telegram&&Telegram.WebApp?Telegram.WebApp:null; if(tg){tg.ready();tg.expand();}
function save(){localStorage.setItem(CART_KEY,JSON.stringify(CART));let el=document.getElementById('cartCount');if(el)el.innerText=CART.length?'Коробка ('+CART.length+')':'Коробка';}
save();
async function load(){
 let g=document.getElementById('grid');
 try{let r=await fetch('/api/products?t='+Date.now());P=await r.json();}catch(e){g.innerHTML='Ошибка';return;}
 CART=CART.filter(id=>P.some(p=>p.id==id));save();
 if(!P.length){g.innerHTML='<div style="grid-column:1/3;text-align:center;padding:30px;border:2px dashed #111;border-radius:12px;font-weight:900">ПУСТО</div>';return;}
 g.innerHTML=P.map(p=>'<div class="card" onclick="openM('+p.id+')"><div class="pic"><img id="im_'+p.id+'"></div><div style="font-size:10px;opacity:.5;font-weight:900;margin-top:4px">'+(p.brand||'')+'</div><div style="font-size:12px;font-weight:900;height:26px;overflow:hidden">'+p.name+'</div><div class="price">'+p.price+'₽</div></div>').join('');
 P.forEach(async p=>{let fid=(p.images&&p.images[0])?p.images[0]:p.img;if(!fid)return;try{let rr=await fetch('/api/file/'+fid);let jj=await rr.json();let el=document.getElementById('im_'+p.id);if(el)el.src=jj.url;}catch(e){}});
}
function openM(id){
 let p=P.find(x=>x.id==id);if(!p)return;
 let imgs=(p.images&&p.images.length?p.images:[p.img]).filter(Boolean);
 let gal=imgs.map((_,i)=>'<img id="g_'+id+'_'+i+'">').join('');
 let inCart=CART.includes(id);
 document.getElementById('modal').innerHTML='<div style="padding:12px;display:flex;justify-content:space-between;border-bottom:3px solid #111"><b style="font-size:11px;opacity:.6">ПОБЛИЖЕ</b><span onclick="closeAll()" style="font-size:24px;cursor:pointer">✕</span></div><div class="gal">'+gal+'</div><div style="padding:14px"><h2>'+(p.brand||'')+' '+p.name+'</h2><div style="opacity:.7;margin:6px 0">'+(p.size||'')+'</div><div style="font-weight:900;font-size:20px;margin:10px 0">'+p.price+'₽</div><button id="buy_'+id+'" class="btn '+(inCart?'added':'')+'" onclick="addToBox('+id+')">'+(inCart?'УБРАТЬ ИЗ КОРОБКИ':'ПОЛОЖИТЬ В КОРОБКУ')+'</button></div>';
 document.getElementById('modal').style.display='block';
 imgs.forEach(async(fid,i)=>{try{let rr=await fetch('/api/file/'+fid);let jj=await rr.json();let el=document.getElementById('g_'+id+'_'+i);if(el)el.src=jj.url;}catch(e){}});
}
function addToBox(id){
 let was=CART.includes(id);
 if(was){CART=CART.filter(x=>x!=id);}else{CART.push(id);document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),300);if(CART.length>=3)boom();}
 save();closeAll();toast(was?'УБРАЛ':'В КОРОБКЕ 📦');
 let ic=document.getElementById('boxIcon');if(ic){ic.classList.add('jump');setTimeout(()=>ic.classList.remove('jump'),600);}
}
function toast(t){let el=document.getElementById('toast');el.innerText=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500);}
function openCart(){renderCart();document.getElementById('cartModal').style.display='block';if(CART.length>=3)boom();}
function closeAll(){document.getElementById('modal').style.display='none';document.getElementById('cartModal').style.display='none';}
function getFlex(){let n=CART.length;if(n==0)return{p:0,txt:'БОМЖ 100% / FLEX 0% - пусто'};if(n==1)return{p:35,txt:'БОМЖ 65% / FLEX 35% - норм'};if(n==2)return{p:70,txt:'БОМЖ 30% / FLEX 70% - свежак'};return{p:100,txt:'БОМЖ 0% / FLEX 100% - БОГ СВЕГА 🔥'};}
function boom(){for(let i=0;i<18;i++){let d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1300);}}
function renderCart(){
 let cm=document.getElementById('cartModal');let items=P.filter(p=>CART.includes(p.id));let total=items.reduce((s,p)=>s+p.price,0);if(DISCOUNT)total=Math.round(total*0.9);
 let flex=getFlex();
 if(!items.length){cm.innerHTML='<div style="padding:12px;display:flex;justify-content:space-between;border-bottom:3px solid #111"><b>КОРОБКА</b><span onclick="closeAll()" style="font-size:24px">✕</span></div><div class="flex"><div style="display:flex;justify-content:space-between;font-weight:900"><span>FLEX METR</span><span>'+flex.p+'%</span></div><div class="bar"><div class="fill" style="width:'+flex.p+'%"></div></div><div style="font-size:10px;margin-top:4px">'+flex.txt+'</div></div><div style="padding:40px;text-align:center;font-weight:900">ПУСТО</div>';return;}
 cm.innerHTML='<div style="padding:12px;display:flex;justify-content:space-between;border-bottom:3px solid #111"><b>КОРОБКА • '+items.length+'</b><span onclick="closeAll()" style="font-size:24px">✕</span></div><div class="flex"><div style="display:flex;justify-content:space-between;font-weight:900"><span>FLEX METR '+(flex.p==100?'🔥':'')+'</span><span>'+flex.p+'%</span></div><div class="bar"><div class="fill" style="width:'+flex.p+'%"></div></div><div style="font-size:10px;margin-top:4px;font-weight:900">'+flex.txt+'</div></div>'+(DISCOUNT?'<div style="margin:10px;border:2px dashed #111;border-radius:10px;padding:8px;text-align:center;font-weight:900">СКИДКА 10% УКРАДЕНА • GOOFY10</div>':'')+items.map(p=>'<div style="display:flex;gap:10px;border:2px solid #111;border-radius:12px;padding:8px;margin:10px"><img id="c_'+p.id+'" style="width:70px;height:70px;border-radius:8px;border:2px solid #111;object-fit:cover"><div style="flex:1"><div style="font-weight:900">'+p.name+'</div><div>'+p.price+'₽</div></div><div onclick="addToBox('+p.id+');renderCart()" style="font-size:20px;cursor:pointer">✕</div></div>').join('')+'<div style="padding:12px;border-top:3px solid #111"><div style="display:flex;justify-content:space-between;font-weight:900"><span>ИТОГО '+(DISCOUNT?'-10%':'')+'</span><span>'+total+'₽</span></div><button class="btn" style="margin-top:10px" onclick="checkout()">ОФОРМИТЬ • '+total+'₽</button></div>';
 items.forEach(async p=>{let fid=(p.images&&p.images[0])?p.images[0]:p.img;if(!fid)return;try{let rr=await fetch('/api/file/'+fid);let jj=await rr.json();let el=document.getElementById('c_'+p.id);if(el)el.src=jj.url;}catch(e){}});
}
function steal(){STEAL++;if(STEAL>=10&&!DISCOUNT){DISCOUNT=1;STEAL=0;toast('СКИДКА 10% УКРАДЕНА!');boom();}else if(STEAL>3){toast(STEAL+'/10');}}
async function checkout(){
 let items=P.filter(p=>CART.includes(p.id));let total=items.reduce((s,p)=>s+p.price,0);if(DISCOUNT)total=Math.round(total*0.9);
 let u=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)?tg.initDataUnsafe.user:{id:0,first_name:'Гость'};
 try{let res=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,items:CART,total,discount:DISCOUNT?10:0})});if(res.ok){document.getElementById('cartModal').innerHTML='<div style="padding:40px;text-align:center"><div style="font-size:40px">📦</div><div style="font-weight:900;margin-top:10px">ЗАКАЗ УЛЕТЕЛ!</div><button class="btn" style="margin-top:15px" onclick="CART=[];DISCOUNT=0;save();closeAll();load();">ОК</button></div>';CART=[];save();boom();}else{alert('Ошибка');}}catch(e){alert('Сеть');}
}
load();
</script></body></html>
