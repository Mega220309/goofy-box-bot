<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOOFY BOX</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box;margin:0}body{background:#fff;color:#111;font-family:monospace;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto;padding-bottom:90px}
.banner-wrap{position:relative;border-bottom:3px solid #111;overflow:hidden;background:#000;height:auto;isolation:isolate}
.banner{width:100%;display:block;object-fit:cover;position:relative;z-index:1;filter:contrast(1.2) brightness(1)}
.banner-wrap::before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(255,255,255,0.15) 3px, rgba(0,0,0,0) 3px);mix-blend-mode:overlay;animation:scan .12s linear infinite}
.banner-wrap::after{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(90deg, transparent 30%, rgba(255,0,0,.25) 50%, rgba(0,255,255,.25) 52%, transparent 70%);transform:translateX(-100%);animation:glitchMove 1.1s steps(4) infinite}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(4px)}}
@keyframes glitchMove{0%{transform:translateX(-100%) skewX(0)}10%{transform:translateX(-20%) skewX(10deg)}20%{transform:translateX(20%) skewX(-10deg)}30%{transform:translateX(10%) skewX(0)}100%{transform:translateX(100%) skewX(0)}}
.banner-wrap.glitch{animation:shakeBanner .25s ease 2}
@keyframes shakeBanner{0%,100%{transform:translate(0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}}
.secret-dot{position:absolute;top:6px;right:10px;z-index:10;font-size:18px;opacity:.7;cursor:pointer;padding:10px;line-height:1}
.head{padding:14px;text-align:center;font-weight:900;border-bottom:3px solid #111;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{border:2.5px solid #111;border-radius:16px;padding:8px;background:#fff;transition:.15s}
.card:active{transform:rotate(-1deg) scale(.98)}
.pic{aspect-ratio:1;background:#f2f2f2;border-radius:12px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.brand{font-size:10px;opacity:.5;font-weight:900;margin-top:6px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-size:12px;font-weight:900;height:26px;overflow:hidden}
.price{background:#111;color:#fff;padding:7px 10px;border-radius:9px;display:inline-block;font-weight:900;font-size:11px;margin-top:6px}
.price.sold{transform:rotate(-2deg)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:3.5px solid #111;display:flex;justify-content:space-around;align-items:flex-end;padding:12px 0 14px;text-align:center;z-index:20}
.nav-item{cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:80px}
.nav-item b{font-size:12px;font-weight:900;line-height:1}
.icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2.5px solid #111;border-radius:6px;position:relative;background:#fff;transition:.3s}
.icon.catalog{width:32px;height:32px;font-size:18px;font-weight:900}
.icon.box{width:36px;height:36px;border-radius:8px}
.icon.box:before{content:'';position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:16px;height:8px;border:2.5px solid #111;border-bottom:0;border-radius:4px 4px 0 0;background:#fff}
.icon.close{border:none;font-size:28px;width:36px;height:36px}
.icon.box.jump{animation:jump.5s ease; background:#111; border-color:#111}
.icon.box.jump:before{background:#111;border-color:#111}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#modal,#cartModal{position:fixed;inset:0;background:#fff;z-index:99;display:none;overflow:auto;max-width:480px;margin:0 auto;border-left:3px solid #111;border-right:3px solid #111}
.gal{width:100%;display:flex;gap:12px;overflow-x:auto;padding:12px;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 85%;width:85%;aspect-ratio:1;object-fit:cover;border-radius:18px;border:3px solid #111;background:#f2f2f2;scroll-snap-align:center;scroll-snap-stop:always}
.dots{display:flex;gap:6px;justify-content:center;padding:6px}
.dots span{width:6px;height:6px;border-radius:50%;background:#ccc;transition:.2s}
.dots span.on{background:#111;width:18px}
.desc{border:2px solid #111;border-radius:12px;padding:12px;margin:12px 0;font-size:12px;line-height:1.4;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.btn{width:100%;padding:18px;border-radius:14px;font-weight:900;border:3px solid #111;background:#111;color:#fff;font-size:15px;transition:.2s}
.btn.added{background:#fff;color:#111;border:3px dashed #111}
.sub{font-size:11px;text-align:center;margin-top:10px;opacity:.5}
