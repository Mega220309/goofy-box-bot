<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>GOOFY</title><style>body{margin:0;font-family:monospace;max-width:480px;margin:0 auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.card{border:2px solid #000;border-radius:12px;padding:6px}</style></head><body><h3 id="c" style="text-align:center">загрузка...</h3><div class="grid" id="g"></div><script>
async function l(){
 let r=await fetch('/api/products'); let d=await r.json();
 document.getElementById('c').innerText='КАТАЛОГ • '+d.length+' ТОВАРА';
 document.getElementById('g').innerHTML=d.map(p=>{
  let img = (p.images&&p.images[0])? p.images[0] : p.img;
  let sold = p.status==='sold_recent';
  return `<div class=card><img src="" id="i${p.id}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#eee"><div style="opacity:.6;font-size:10px">${p.brand}</div><div style="font-weight:900">${p.name}</div><div style="background:${sold?'red':'#000'};color:#fff;display:inline-block;padding:4px 8px;border-radius:6px;margin-top:4px;font-size:11px">${sold?'СПИЗДИЛИ? САМ ВИНОВАТ!':p.price+'₽'}</div></div>`
 }).join('');
 d.forEach(async p=>{
  let imgId = p.img || (p.images&&p.images[0]);
  if(!imgId) return;
  try{
   let rr=await fetch('/api/file/'+imgId); let jj=await rr.json();
   let el=document.getElementById('i'+p.id); if(el) el.src=jj.url;
  }catch(e){}
 });
}
l();
</script></body></html>
