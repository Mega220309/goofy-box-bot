<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOOFY BOX</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
body{margin:0;font-family:monospace;background:#fff;color:#111}
.banner{width:100%;display:block;border-bottom:3px solid #000}

.head{text-align:center;font-weight:900;padding:12px;border-bottom:3px solid #000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{border:2.5px solid #000;border-radius:14px;padding:8px;transform:rotate(.3deg)}

.pic{background:#eee;aspect-ratio:1;border-radius:10px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.dirty{background:#ffeb3b;border:1.5px dashed #000;padding:5px 10px;border-radius:3px 9px 3px 9px;transform:rotate(-2deg);display:inline-block;font-weight:900;margin-top:5px;box-shadow:2px 2px 0 #000}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:3px solid #000;display:flex;justify-content:space-around;padding:10px 0;text-align:center}
.btn{width:100%;padding:14px;border-radius:10px;font-weight:900;border:3px solid #000;background:#000;color:#fff;margin-top:8px}
.btn2{width:100%;padding:12px;border-radius:10px;font-weight:900;border:2.5px dashed #000;background:#fff;color:#000;margin-top:8px}
#modal,#cart{position:fixed;inset:0;background:#fff;z-index:99;display:none;overflow:auto;max-width:480px;margin:0 auto;border-left:3px solid #000;border-right:3px solid #000}
.gal{display:flex;gap:8px;overflow-x:auto;padding:10px}
.gal img{flex:0 0 85%;border:3px solid #000;border-radius:12px;aspect-ratio:1;object-fit:cover}
.review{margin:10px;border:2px solid #000;border-radius:10px;padding:8px;background:#f9f9f9}
.shake{animation:shake.3s}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
